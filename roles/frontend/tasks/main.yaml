- name: common code 
  ansible.builtin.import_role:
    name: common
    tasks_from: app-pre-req

- name: copy the code
  ansible.builtin.template:
    src: expense.conf.j2
    dest: /etc/nginx/default.d/expense.conf
  notify:
  - restart nginx



